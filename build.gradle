plugins {
    id 'java'
    id "io.freefair.lombok" version "8.13"
    id "run.halo.plugin.devtools" version "0.6.1"
}

group 'com.bi1kbu.articleid.articleidmanagement'
def gradlePropsFile = file('gradle.properties')
if (!gradlePropsFile.exists()) {
    throw new GradleException("Missing gradle.properties")
}

def propsText = gradlePropsFile.getText('UTF-8')
def versionMatcher = (propsText =~ /(?m)^version\s*=\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$/)
if (!versionMatcher.find()) {
    throw new GradleException("Missing or invalid 'version' in gradle.properties, expected x.y.z")
}

def bumpPatchVersion = { String rawVersion ->
    def parts = rawVersion.tokenize('.').collect { it as Integer }
    [parts[0], parts[1], parts[2] + 1].join('.')
}

def currentVersion = versionMatcher.group(1)
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
def shouldAutoBumpVersion = requestedTaskNames.any { it in ['releaseBuild', 'releaseJar'] }
def effectiveVersion = currentVersion

if (shouldAutoBumpVersion) {
    def nextVersion = bumpPatchVersion(currentVersion)
    def updatedPropsText = propsText.replaceFirst(
        /(?m)^version\s*=\s*[0-9]+\.[0-9]+\.[0-9]+\s*$/,
        "version=${nextVersion}".toString()
    )
    gradlePropsFile.write(updatedPropsText, 'UTF-8')
    effectiveVersion = nextVersion.toString()
    logger.lifecycle("Auto bumped plugin version: ${currentVersion} -> ${nextVersion}")
}

version = effectiveVersion.toString()

tasks.register('devBuild') {
    group = 'build'
    description = 'Build plugin for development without bumping version.'
    dependsOn tasks.named('build')
}

tasks.register('releaseJar') {
    group = 'build'
    description = 'Bump patch version in gradle.properties and package jar.'
    dependsOn tasks.named('jar')
}

tasks.register('releaseBuild') {
    group = 'build'
    description = 'Bump patch version in gradle.properties and run full build.'
    dependsOn tasks.named('build')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.22.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/console')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

halo {
    version = '2.22'
}
